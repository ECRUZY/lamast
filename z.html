<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Макеты заказа | Lamast</title>
  <meta name="theme-color" content="#140F2E">
  <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700;800&family=Onest:wght@400;500;600&family=Marck+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=202611181618">
  <style>
    body { background: var(--mist); }
    .order-top { background: var(--night); color: #fff; padding: 18px 0; }
    .order-top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .order { padding: 40px 0 80px; }
    .order h1 { font-size: clamp(28px, 3.6vw, 44px); font-weight: 700; margin-bottom: 24px; }
    .order__grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
    .order__card { background: #fff; border-radius: var(--r-lg); overflow: hidden; }
    .order__card .stage { height: clamp(340px, 42vw, 560px); border-radius: 0; }
    .order__specs { padding: 20px 24px 24px; display: grid; gap: 6px; }
    .order__specs h2 { font-size: 22px; margin-bottom: 6px; }
    .order__specs dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 15px; }
    .order__specs dt { color: var(--muted); }
    .order__specs dd { margin: 0; font-weight: 500; }
    .order__files { display: grid; gap: 12px; }
    .file { background: #fff; border-radius: var(--r-lg); overflow: hidden; display: grid; grid-template-columns: 120px 1fr; }
    .file__view { background: var(--mist); display: grid; place-items: center; min-height: 120px; }
    .file__view img { width: 100%; height: 100%; max-height: 160px; object-fit: contain; }
    .file__ext { font: 700 24px/1 var(--display); color: var(--violet); }
    .file__body { padding: 14px 16px; display: grid; gap: 10px; align-content: center; }
    .file__name { font-weight: 600; overflow-wrap: anywhere; }
    .file__actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .file__actions .btn { min-height: 40px; padding: 0 16px; font-size: 14px; }
    .btn--light { --bg: var(--mist); --fg: var(--ink); }
    .order__empty { background: #fff; border-radius: var(--r-lg); padding: 32px; max-width: 560px; }
    .order--files-only .order__grid { grid-template-columns: minmax(0, 720px); }
    @media (max-width: 860px) {
      .order__grid { grid-template-columns: 1fr; }
      .order__card .stage { height: 320px; }
    }
  </style>
</head>
<body>
  <header class="order-top">
    <div class="wrap">
      <a class="brand brand--light" href="./"><img src="assets/logo-mark.svg" alt="" width="30" height="30"><span>lamast</span></a>
      <a class="btn btn--wa btn--sm" data-wa href="#" target="_blank" rel="noopener">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2Z"/></svg>
        WhatsApp
      </a>
    </div>
  </header>

  <main class="order" data-order>
    <div class="wrap">
      <h1>Макеты заказа</h1>
      <div class="order__grid">
        <section class="order__card" data-preview hidden>
          <div class="stage" data-stage aria-hidden="true"></div>
          <div class="order__specs">
            <h2 data-title></h2>
            <dl data-specs></dl>
          </div>
        </section>
        <div class="order__files" data-files></div>
      </div>
    </div>
  </main>

  <script src="config.js?v=202611181618"></script>
  <script src="preview.js?v=202611181618"></script>
  <script>
    (function () {
      document.querySelector("[data-wa]").href = "https://wa.me/" + CONFIG.whatsapp;
      const params = new URLSearchParams(location.search);
      // прямой адрес картинки Google Диска: отдаёт разрешение CORS, поэтому неон можно собрать из макета
      const thumb = (id, w) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
      // прямой адрес с разрешением CORS: нужен только чтобы собрать неон из рисунка прямо на странице
      const thumbCors = (id, w) => `https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}=w${w}`;

      // Ссылка вида z?ID.ID&c=код_заказа[&t=текст]. Старые ссылки: z.html?f=ID~имя,ID~имя&p=изделие.
      let raw = [];
      if (params.has("f")) {
        raw = params.get("f").split(",").map((part) => {
          const [id, name = ""] = part.split("~");
          let n = ""; try { n = decodeURIComponent(name); } catch (e) { n = name; }
          return { uuid: id, name: n };
        });
      } else {
        raw = location.search.slice(1).split("&")[0].split(".").map((id) => ({ uuid: id, name: "" }));
      }
      const files = raw.filter((x) => /^[\w-]{20,}$/.test(x.uuid))
        .map((x, i, all) => ({ uuid: x.uuid, name: x.name || (all.length > 1 ? `Макет ${i + 1}` : "Макет") }));

      const root = document.querySelector("[data-files]");
      if (!files.length) {
        root.outerHTML = '<p class="order__empty">Ссылка на макеты неполная или устарела. Напишите нам в WhatsApp, и мы пришлём макет заново.</p>';
        return;
      }

      // изделие с макетом, как в конструкторе
      const hasOrder = applyOrderCode(params.get("c"), params.get("t"));
      // готовый неон из конструктора (параметр n): показываем его как обычную картинку
      const neonId = params.get("n");
      if (hasOrder && state.id === "neon" && /^[\w-]{20,}$/.test(neonId || "")) {
        state.neonBaked = `https://drive.google.com/thumbnail?id=${encodeURIComponent(neonId)}&sz=w1600`;
      }
      if (hasOrder) {
        // все макеты заказа; у визиток первый — лицевая сторона, второй — оборотная
        if (state.id === "cards" && state.opts.sides === "Двусторонние") {
          ["Лицевая сторона", "Оборотная сторона"].forEach((label, i) => { if (files[i] && /^Макет( \d+)?$/.test(files[i].name)) files[i].name = label; });
        }
        const neonLive = state.id === "neon" && !state.neonBaked;
        state.files = files.map((x, i) => ({ url: neonLive ? thumbCors(x.uuid, 1600) : thumb(x.uuid, 1600), alt: thumb(x.uuid, 1600), file: { name: x.name }, side: state.id === "cards" ? (i === 0 ? "front" : i === 1 ? "back" : undefined) : undefined }));
        state.pic = 0;
        const p = product();
        const card = document.querySelector("[data-preview]");
        card.hidden = false;
        document.querySelector("[data-title]").textContent = p.title;
        const rows = p.options.map((o) => [o.label, state.opts[o.key]]).filter((r) => r[1]);
        if (p.size) rows.push(["Размер", `${fmt(state.w)} × ${fmt(state.h)} ${p.size.unit}`]);
        if (p.qty && state.qty) rows.push(["Тираж", `${state.qty} ${p.qty.unit}`]);
        document.querySelector("[data-specs]").innerHTML = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
        const stage = document.querySelector("[data-stage]");
        const draw = () => {
          const { bg, html } = VIEWS[p.view](stage.clientWidth || 600, stage.clientHeight || 420);
          stage.className = "stage " + bg;
          stage.innerHTML = html;
        };
        window.onNeonReady = draw;
        draw();
        let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(draw, 120); });
      } else {
        document.querySelector("[data-order]").classList.add("order--files-only");
      }

      // файлы: превью с Диска и кнопки
      root.innerHTML = files.map((x) => {
        const id = encodeURIComponent(x.uuid);
        const ext = x.name.includes(".") ? x.name.split(".").pop().slice(0, 4).toUpperCase() : "ФАЙЛ";
        return `<article class="file">
          <div class="file__view"><img src="${thumb(x.uuid, 400)}" alt="${esc(x.name)}" data-ext="${esc(ext)}" loading="lazy" referrerpolicy="no-referrer"></div>
          <div class="file__body">
            <div class="file__name">${esc(x.name)}</div>
            <div class="file__actions">
              <a class="btn btn--dark" href="https://drive.google.com/uc?export=download&id=${id}">Скачать</a>
              <a class="btn btn--light" href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener">Открыть на Диске</a>
            </div>
          </div>
        </article>`;
      }).join("");

      // Диск не сделал миниатюру (CDR, AI, архив): показываем формат файла
      root.querySelectorAll("img[data-ext]").forEach((img) => {
        img.addEventListener("error", () => {
          const span = document.createElement("span");
          span.className = "file__ext";
          span.textContent = img.dataset.ext;
          img.replaceWith(span);
        }, { once: true });
      });
    })();
  </script>
</body>
</html>
